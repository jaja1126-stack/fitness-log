<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>健身紀錄</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#201517">
<style>
  :root{
    --bg:#201517;
    --bg2:#2b1c1f;
    --card:#3a2529;
    --accent:#b76e79;
    --text:#f3e6e2;
    --muted:#b89a95;
    --border:#4a3236;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    padding:20px 16px 12px;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:20px;
    letter-spacing:2px;
  }
  header p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:12px;
  }
  nav{
    display:flex;
    gap:8px;
    padding:0 16px 12px;
  }
  nav button{
    flex:1;
    padding:10px 0;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg2);
    color:var(--muted);
    font-size:14px;
    -webkit-tap-highlight-color:transparent;
  }
  nav button.active{
    background:var(--accent);
    color:white;
    border-color:var(--accent);
  }
  main{
    padding:0 16px 32px;
    max-width:480px;
    margin:0 auto;
  }
  .view{display:none;}
  .view.active{display:block;}
  .card{
    background:var(--bg2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:10px 0 4px;
  }
  label:first-child{margin-top:0;}
  input, select, textarea{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:15px;
  }
  select{appearance:none;-webkit-appearance:none;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .btn{
    width:100%;
    padding:12px;
    margin-top:16px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:white;
    font-size:15px;
    font-weight:600;
  }
  .btn.secondary{
    background:transparent;
    border:1px solid var(--accent);
    color:var(--accent);
  }
  .btn.small{
    width:auto;
    padding:8px 14px;
    margin-top:0;
    font-size:13px;
  }
  .log-item{
    border-bottom:1px solid var(--border);
    padding:10px 0;
    font-size:14px;
  }
  .log-item:last-child{border-bottom:none;}
  .log-top{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:12px;
  }
  .log-main{
    margin-top:4px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .log-ex{font-weight:600;}
  .log-detail{color:var(--muted);font-size:12px;margin-top:2px;}
  .del{
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    padding:4px 8px;
  }
  .filter-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .filter-row select{flex:1;}
  canvas{
    width:100%;
    height:220px;
    background:var(--bg);
    border-radius:10px;
  }
  .empty{
    color:var(--muted);
    text-align:center;
    padding:24px 0;
    font-size:13px;
  }
  .manage-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .manage-item:last-child{border-bottom:none;}
  .manage-sub{color:var(--muted);font-size:12px;}
  .eq-thumb{
    width:44px;height:44px;
    border-radius:8px;
    object-fit:cover;
    margin-right:10px;
    flex-shrink:0;
    background:var(--bg);
  }
  .manage-item-left{display:flex;align-items:center;flex:1;min-width:0;}
  .manage-item-text{min-width:0;}
  .photo-preview{
    width:80px;height:80px;
    border-radius:10px;
    object-fit:cover;
    margin-top:8px;
    display:none;
    background:var(--bg);
  }
  .log-item.editing{background:var(--bg);border-radius:10px;padding:12px;margin:6px 0;}
  .edit-actions{display:flex;gap:8px;margin-top:10px;}
  .edit-actions .btn{margin-top:0;}
  .log-main{cursor:pointer;}
  h2.section-title{
    font-size:14px;
    color:var(--muted);
    margin:0 0 10px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  #signin-screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:24px;
    text-align:center;
  }
  #signin-screen h1{font-size:20px;margin:0;}
  #signin-screen p{color:var(--muted);font-size:13px;margin:0;max-width:280px;}
  #btn-signin{
    padding:12px 28px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:white;
    font-size:15px;
    font-weight:600;
  }
  #app-root{display:none;}
  .sync-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:11px;
    color:var(--muted);
    padding:2px 0 4px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#4caf50;
    flex-shrink:0;
  }
  .dot.offline{background:#e9a544;}
  .dot.error{background:var(--accent);}
</style>
</head>
<body>

<div id="signin-screen">
  <h1>健身紀錄</h1>
  <p>登入 Google 帳號後，紀錄會自動同步到你所有裝置，離線時仍可記錄，恢復連線後自動上傳。</p>
  <button id="btn-signin">使用 Google 帳號登入</button>
</div>

<div id="app-root">
<header>
  <h1>健身紀錄</h1>
  <p>器材型號 · 重量 · 組數次數</p>
</header>
<div class="sync-bar">
  <span class="dot" id="sync-dot"></span>
  <span id="sync-text">同步中…</span>
</div>

<nav>
  <button data-view="log" class="active">紀錄</button>
  <button data-view="history">歷史</button>
  <button data-view="trend">趨勢</button>
  <button data-view="manage">管理</button>
</nav>

<main>

  <!-- 紀錄 -->
  <section class="view active" id="view-log">
    <div class="card">
      <label>日期</label>
      <input type="date" id="f-date">

      <label>動作</label>
      <select id="f-exercise"></select>

      <label>器材（品牌＋型號）</label>
      <select id="f-equipment"></select>

      <div class="row2">
        <div>
          <label>重量 (kg)</label>
          <input type="number" step="0.5" id="f-weight" placeholder="例如 40">
        </div>
        <div>
          <label>次數</label>
          <input type="number" id="f-reps" value="15" placeholder="例如 15">
        </div>
        <div>
          <label>組數</label>
          <input type="number" id="f-sets" value="3" placeholder="例如 3">
        </div>
      </div>

      <label>RPE / 備註</label>
      <textarea id="f-note" rows="2" placeholder="選填，例如 RPE8、感覺、代償狀況"></textarea>

      <button class="btn" id="btn-save">儲存紀錄</button>
    </div>
  </section>

  <!-- 歷史 -->
  <section class="view" id="view-history">
    <div class="card">
      <div class="filter-row">
        <select id="hist-filter-exercise"><option value="">全部動作</option></select>
        <select id="hist-filter-equipment"><option value="">全部器材</option></select>
      </div>
      <div id="history-list"><div class="empty">尚無紀錄</div></div>
    </div>
  </section>

  <!-- 趨勢 -->
  <section class="view" id="view-trend">
    <div class="card">
      <label>選擇動作看重量趨勢</label>
      <select id="trend-exercise"></select>
      <canvas id="trend-canvas" width="600" height="440"></canvas>
      <div class="empty" id="trend-empty" style="display:none;">此動作尚無足夠紀錄</div>
    </div>
  </section>

  <!-- 管理 -->
  <section class="view" id="view-manage">
    <div class="card">
      <h2 class="section-title">新增動作</h2>
      <div class="row2">
        <div><input type="text" id="new-ex-name" placeholder="例如 臥推、深蹲"></div>
        <button class="btn small" id="btn-add-ex">新增</button>
      </div>
      <div id="ex-list" style="margin-top:12px;"></div>
    </div>

    <div class="card">
      <h2 class="section-title">新增器材</h2>
      <label>品牌</label>
      <input type="text" id="new-eq-brand" placeholder="例如 Hammer Strength">
      <label>型號</label>
      <input type="text" id="new-eq-model" placeholder="例如 臥推機 HS-1234">
      <label>地點（選填）</label>
      <input type="text" id="new-eq-location" placeholder="例如 公司旁健身房">
      <label>照片（選填）</label>
      <input type="file" id="new-eq-photo" accept="image/*" capture="environment">
      <img id="new-eq-photo-preview" class="photo-preview">
      <button class="btn" id="btn-add-eq">新增器材</button>
      <div id="eq-list" style="margin-top:12px;"></div>
    </div>

    <div class="card">
      <h2 class="section-title">資料備份</h2>
      <button class="btn secondary" id="btn-export">匯出 JSON</button>
      <button class="btn secondary" id="btn-export-xlsx" style="margin-top:8px;">匯出 Excel</button>
      <label style="margin-top:12px;">匯入 JSON</label>
      <input type="file" id="import-file" accept="application/json">
    </div>

    <div class="card">
      <h2 class="section-title">帳號</h2>
      <div id="account-email" class="manage-sub" style="margin-bottom:10px;"></div>
      <button class="btn secondary" id="btn-signout">登出</button>
    </div>
  </section>

</main>
</div><!-- /app-root -->

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, setDoc, onSnapshot,
  enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAABFcrHJkWBEDdRCi1dqHJ9rVYDiPwxGc",
  authDomain: "fitness-log-a5fcf.firebaseapp.com",
  projectId: "fitness-log-a5fcf",
  storageBucket: "fitness-log-a5fcf.firebasestorage.app",
  messagingSenderId: "620579634494",
  appId: "1:620579634494:web:9cdcaaf1d9fab4d6f1c06f"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const fs = getFirestore(fbApp);
enableIndexedDbPersistence(fs).catch(()=>{ /* multiple tabs open, ignore */ });

const DB_KEY = 'fitnessLogDB_v1';
let currentUid = null;
let unsubscribeSnapshot = null;
let suppressNextWrite = false; // avoid re-writing right after receiving our own snapshot

function loadLocalCache(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ return JSON.parse(raw); }
  return { exercises: [], equipment: [], logs: [] };
}
function saveLocalCache(){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}
let db = loadLocalCache();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function setSyncStatus(state, text){
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-text');
  dot.className = 'dot' + (state === 'offline' ? ' offline' : state === 'error' ? ' error' : '');
  label.textContent = text;
}

// ---------- Save to Firestore (debounced) whenever local db changes ----------
let saveTimer = null;
function saveDB(){
  saveLocalCache();
  if(!currentUid) return;
  clearTimeout(saveTimer);
  setSyncStatus('syncing', navigator.onLine ? '同步中…' : '離線，將於恢復連線後同步');
  saveTimer = setTimeout(()=>{
    suppressNextWrite = true;
    setDoc(doc(fs, 'users', currentUid), db)
      .then(()=> setSyncStatus('ok', navigator.onLine ? '已同步' : '已排入離線佇列，恢復連線後上傳'))
      .catch((err)=> setSyncStatus('error', '同步失敗：' + err.message));
  }, 400);
}

// ---------- Auth ----------
document.getElementById('btn-signin').addEventListener('click', ()=>{
  const provider = new GoogleAuthProvider();
  const btn = document.getElementById('btn-signin');
  btn.disabled = true;
  btn.textContent = '登入中…';
  signInWithPopup(auth, provider)
    .catch((err)=>{
      // popup blocked / not supported (common inside installed PWA / in-app
      // browsers) — fall back to full-page redirect
      if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(err.code)){
        signInWithRedirect(auth, provider);
        return;
      }
      btn.disabled = false;
      btn.textContent = '使用 Google 帳號登入';
      if(err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request'){
        alert('登入失敗：' + err.message);
      }
    });
});
document.getElementById('btn-signout').addEventListener('click', ()=>{
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  signOut(auth);
});

getRedirectResult(auth).catch((err)=>{
  console.error('redirect sign-in error', err);
});

onAuthStateChanged(auth, (user)=>{
  if(user){
    currentUid = user.uid;
    document.getElementById('signin-screen').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';
    document.getElementById('account-email').textContent = user.email || user.displayName || '';

    if(unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = onSnapshot(doc(fs, 'users', currentUid), (snap)=>{
      if(suppressNextWrite){ suppressNextWrite = false; }
      if(snap.exists()){
        const data = snap.data();
        db = {
          exercises: data.exercises || [],
          equipment: data.equipment || [],
          logs: data.logs || []
        };
      } else {
        // first login, no doc yet — push whatever local cache we have (may be empty)
        setDoc(doc(fs, 'users', currentUid), db).catch(()=>{});
      }
      saveLocalCache();
      refreshExerciseSelects();
      refreshEquipmentSelects();
      const activeView = document.querySelector('.view.active').id;
      if(activeView === 'view-history') renderHistory();
      if(activeView === 'view-trend') renderTrend();
      if(activeView === 'view-manage') renderManage();
      setSyncStatus('ok', navigator.onLine ? '已同步' : '離線（顯示上次同步的資料）');
    }, (err)=>{
      setSyncStatus('error', '連線失敗：' + err.message);
    });
  } else {
    currentUid = null;
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    document.getElementById('signin-screen').style.display = 'flex';
    document.getElementById('app-root').style.display = 'none';
  }
});

window.addEventListener('online', ()=> setSyncStatus('ok', '連線已恢復，同步中…'));
window.addEventListener('offline', ()=> setSyncStatus('offline', '離線，將於恢復連線後同步'));

// ---------- Nav ----------
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='history') renderHistory();
    if(btn.dataset.view==='trend') renderTrend();
    if(btn.dataset.view==='manage') renderManage();
  });
});

// ---------- Populate selects ----------
function refreshExerciseSelects(){
  const opts = db.exercises.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
  document.getElementById('f-exercise').innerHTML = opts || '<option value="">請先到「管理」新增動作</option>';
  document.getElementById('trend-exercise').innerHTML = opts || '<option value="">請先到「管理」新增動作</option>';
  document.getElementById('hist-filter-exercise').innerHTML = '<option value="">全部動作</option>' + opts;
}
function refreshEquipmentSelects(){
  const opts = db.equipment.map(e=>{
    const label = [e.brand, e.model].filter(Boolean).join(' ') + (e.location ? ` (${e.location})` : '');
    return `<option value="${e.id}">${escapeHtml(label)}</option>`;
  }).join('');
  document.getElementById('f-equipment').innerHTML = opts || '<option value="">請先到「管理」新增器材</option>';
  document.getElementById('hist-filter-equipment').innerHTML = '<option value="">全部器材</option>' + opts;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Photo compression (keep Firestore doc size sane) ----------
function compressImage(file, maxDim=400, quality=0.6){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
let pendingNewEqPhoto = null;
document.getElementById('new-eq-photo').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  pendingNewEqPhoto = await compressImage(file);
  const preview = document.getElementById('new-eq-photo-preview');
  preview.src = pendingNewEqPhoto;
  preview.style.display = 'block';
});

// ---------- Save log ----------
document.getElementById('f-date').valueAsDate = new Date();
document.getElementById('btn-save').addEventListener('click', ()=>{
  const exId = document.getElementById('f-exercise').value;
  const eqId = document.getElementById('f-equipment').value;
  const weight = document.getElementById('f-weight').value;
  const sets = document.getElementById('f-sets').value;
  const reps = document.getElementById('f-reps').value;
  if(!exId || !document.getElementById('f-date').value){
    alert('請確認日期與動作已選擇');
    return;
  }
  db.logs.push({
    id: uid(),
    date: document.getElementById('f-date').value,
    exerciseId: exId,
    equipmentId: eqId || null,
    weight: weight ? Number(weight) : null,
    sets: sets ? Number(sets) : null,
    reps: reps ? Number(reps) : null,
    note: document.getElementById('f-note').value.trim()
  });
  saveDB();
  document.getElementById('f-weight').value='';
  document.getElementById('f-sets').value='3';
  document.getElementById('f-reps').value='15';
  document.getElementById('f-note').value='';
  alert('已儲存');
});

// ---------- History ----------
let editingLogId = null;

function renderHistory(){
  const exFilter = document.getElementById('hist-filter-exercise').value;
  const eqFilter = document.getElementById('hist-filter-equipment').value;
  let logs = [...db.logs].sort((a,b)=> b.date.localeCompare(a.date));
  if(exFilter) logs = logs.filter(l=>l.exerciseId===exFilter);
  if(eqFilter) logs = logs.filter(l=>l.equipmentId===eqFilter);

  const list = document.getElementById('history-list');
  if(logs.length===0){
    list.innerHTML = '<div class="empty">尚無符合的紀錄</div>';
    return;
  }

  const exOptions = db.exercises.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
  const eqOptions = db.equipment.map(e=>{
    const label = [e.brand, e.model].filter(Boolean).join(' ') + (e.location ? ` (${e.location})` : '');
    return `<option value="${e.id}">${escapeHtml(label)}</option>`;
  }).join('');

  list.innerHTML = logs.map(l=>{
    if(l.id === editingLogId){
      return `<div class="log-item editing" data-id="${l.id}">
        <label>日期</label>
        <input type="date" class="edit-date" value="${l.date}">
        <label>動作</label>
        <select class="edit-exercise">${exOptions}</select>
        <label>器材</label>
        <select class="edit-equipment"><option value="">（無）</option>${eqOptions}</select>
        <div class="row2">
          <div><label>重量 (kg)</label><input type="number" step="0.5" class="edit-weight" value="${l.weight ?? ''}"></div>
          <div><label>次數</label><input type="number" class="edit-reps" value="${l.reps ?? ''}"></div>
          <div><label>組數</label><input type="number" class="edit-sets" value="${l.sets ?? ''}"></div>
        </div>
        <label>RPE / 備註</label>
        <textarea rows="2" class="edit-note">${escapeHtml(l.note || '')}</textarea>
        <div class="edit-actions">
          <button class="btn small" data-save="${l.id}" style="flex:1;">儲存</button>
          <button class="btn small secondary" data-cancel style="flex:1;">取消</button>
        </div>
      </div>`;
    }
    const ex = db.exercises.find(e=>e.id===l.exerciseId);
    const eq = db.equipment.find(e=>e.id===l.equipmentId);
    const eqLabel = eq ? [eq.brand, eq.model].filter(Boolean).join(' ') : '';
    const detail = [
      l.weight!=null ? `${l.weight}kg` : null,
      (l.sets!=null && l.reps!=null) ? `${l.sets}組 x ${l.reps}下` : null,
      eqLabel || null,
      l.note || null
    ].filter(Boolean).join(' · ');
    return `<div class="log-item" data-id="${l.id}">
      <div class="log-top"><span>${l.date}</span></div>
      <div class="log-main" data-edit="${l.id}">
        <div>
          <div class="log-ex">${escapeHtml(ex ? ex.name : '未知動作')}</div>
          <div class="log-detail">${escapeHtml(detail)}</div>
        </div>
        <button class="del" data-del="${l.id}">✕</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      if(!confirm('確定刪除這筆紀錄？')) return;
      db.logs = db.logs.filter(l=>l.id!==btn.dataset.del);
      saveDB();
      renderHistory();
    });
  });
  list.querySelectorAll('[data-edit]').forEach(row=>{
    row.addEventListener('click', ()=>{
      editingLogId = row.dataset.edit;
      renderHistory();
    });
  });
  list.querySelectorAll('[data-cancel]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingLogId = null;
      renderHistory();
    });
  });
  list.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = btn.closest('.log-item');
      const l = db.logs.find(x=>x.id===btn.dataset.save);
      if(!l) return;
      l.date = item.querySelector('.edit-date').value || l.date;
      l.exerciseId = item.querySelector('.edit-exercise').value || l.exerciseId;
      l.equipmentId = item.querySelector('.edit-equipment').value || null;
      const w = item.querySelector('.edit-weight').value;
      const s = item.querySelector('.edit-sets').value;
      const r = item.querySelector('.edit-reps').value;
      l.weight = w ? Number(w) : null;
      l.sets = s ? Number(s) : null;
      l.reps = r ? Number(r) : null;
      l.note = item.querySelector('.edit-note').value.trim();
      editingLogId = null;
      saveDB();
      renderHistory();
    });
  });

  // pre-select current values in the edit form (after options are in the DOM)
  if(editingLogId){
    const l = db.logs.find(x=>x.id===editingLogId);
    const item = list.querySelector(`.log-item.editing[data-id="${editingLogId}"]`);
    if(l && item){
      item.querySelector('.edit-exercise').value = l.exerciseId || '';
      item.querySelector('.edit-equipment').value = l.equipmentId || '';
    }
  }
}
document.getElementById('hist-filter-exercise').addEventListener('change', renderHistory);
document.getElementById('hist-filter-equipment').addEventListener('change', renderHistory);

// ---------- Trend ----------
function renderTrend(){
  const exId = document.getElementById('trend-exercise').value;
  const canvas = document.getElementById('trend-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const points = db.logs
    .filter(l=>l.exerciseId===exId && l.weight!=null)
    .sort((a,b)=>a.date.localeCompare(b.date));

  document.getElementById('trend-empty').style.display = points.length<2 ? 'block':'none';
  if(points.length<2) return;

  const pad = 40;
  const w = canvas.width - pad*2;
  const h = canvas.height - pad*2;
  const weights = points.map(p=>p.weight);
  const minW = Math.min(...weights)*0.9;
  const maxW = Math.max(...weights)*1.1;

  ctx.strokeStyle = '#26314a';
  ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const y = pad + h - (h*i/4);
    ctx.beginPath();
    ctx.moveTo(pad,y);
    ctx.lineTo(pad+w,y);
    ctx.stroke();
    const val = minW + (maxW-minW)*i/4;
    ctx.fillStyle = '#9aa5b1';
    ctx.font = '11px sans-serif';
    ctx.fillText(val.toFixed(1)+'kg', 4, y+4);
  }

  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  points.forEach((p,i)=>{
    const x = pad + (w * i/(points.length-1));
    const y = pad + h - (h * (p.weight-minW)/(maxW-minW));
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  ctx.fillStyle = '#e94560';
  points.forEach((p,i)=>{
    const x = pad + (w * i/(points.length-1));
    const y = pad + h - (h * (p.weight-minW)/(maxW-minW));
    ctx.beginPath();
    ctx.arc(x,y,3.5,0,Math.PI*2);
    ctx.fill();
  });

  ctx.fillStyle = '#9aa5b1';
  ctx.font = '10px sans-serif';
  const step = Math.ceil(points.length/5);
  points.forEach((p,i)=>{
    if(i%step===0 || i===points.length-1){
      const x = pad + (w * i/(points.length-1));
      ctx.fillText(p.date.slice(5), x-14, canvas.height-8);
    }
  });
}
document.getElementById('trend-exercise').addEventListener('change', renderTrend);

// ---------- Manage ----------
document.getElementById('btn-add-ex').addEventListener('click', ()=>{
  const name = document.getElementById('new-ex-name').value.trim();
  if(!name) return;
  db.exercises.push({id: uid(), name});
  saveDB();
  document.getElementById('new-ex-name').value='';
  refreshExerciseSelects();
  renderManage();
});
document.getElementById('btn-add-eq').addEventListener('click', ()=>{
  const brand = document.getElementById('new-eq-brand').value.trim();
  const model = document.getElementById('new-eq-model').value.trim();
  const location = document.getElementById('new-eq-location').value.trim();
  if(!brand && !model) return;
  db.equipment.push({id: uid(), brand, model, location, photo: pendingNewEqPhoto || null});
  saveDB();
  document.getElementById('new-eq-brand').value='';
  document.getElementById('new-eq-model').value='';
  document.getElementById('new-eq-location').value='';
  document.getElementById('new-eq-photo').value='';
  document.getElementById('new-eq-photo-preview').style.display='none';
  pendingNewEqPhoto = null;
  refreshEquipmentSelects();
  renderManage();
});

function renderManage(){
  const exList = document.getElementById('ex-list');
  exList.innerHTML = db.exercises.length ? db.exercises.map(e=>`
    <div class="manage-item">
      <span>${escapeHtml(e.name)}</span>
      <button class="del" data-del-ex="${e.id}">✕</button>
    </div>`).join('') : '<div class="empty">尚未新增動作</div>';

  const eqList = document.getElementById('eq-list');
  eqList.innerHTML = db.equipment.length ? db.equipment.map(e=>`
    <div class="manage-item">
      <div class="manage-item-left">
        <img class="eq-thumb" src="${e.photo || './icon-192.png'}" alt="">
        <div class="manage-item-text">
          <div>${escapeHtml([e.brand,e.model].filter(Boolean).join(' '))}</div>
          ${e.location ? `<div class="manage-sub">${escapeHtml(e.location)}</div>` : ''}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;">
        <label class="btn small secondary" style="margin:0;">
          換照片<input type="file" accept="image/*" capture="environment" style="display:none;" data-photo-for="${e.id}">
        </label>
        <button class="del" data-del-eq="${e.id}">✕</button>
      </div>
    </div>`).join('') : '<div class="empty">尚未新增器材</div>';

  exList.querySelectorAll('[data-del-ex]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      db.exercises = db.exercises.filter(e=>e.id!==btn.dataset.delEx);
      saveDB(); refreshExerciseSelects(); renderManage();
    });
  });
  eqList.querySelectorAll('[data-del-eq]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      db.equipment = db.equipment.filter(e=>e.id!==btn.dataset.delEq);
      saveDB(); refreshEquipmentSelects(); renderManage();
    });
  });
  eqList.querySelectorAll('[data-photo-for]').forEach(input=>{
    input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const photo = await compressImage(file);
      const eq = db.equipment.find(x=>x.id===input.dataset.photoFor);
      if(eq){ eq.photo = photo; saveDB(); renderManage(); }
    });
  });
}

// ---------- Export / Import ----------
document.getElementById('btn-export').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fitness-log-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('btn-export-xlsx').addEventListener('click', ()=>{
  if(typeof XLSX === 'undefined'){
    alert('Excel 匯出元件尚未載入，請確認網路連線後再試一次');
    return;
  }
  const rows = [...db.logs]
    .sort((a,b)=> a.date.localeCompare(b.date))
    .map(l=>{
      const ex = db.exercises.find(e=>e.id===l.exerciseId);
      const eq = db.equipment.find(e=>e.id===l.equipmentId);
      return {
        '日期': l.date,
        '動作': ex ? ex.name : '',
        '器材': eq ? [eq.brand, eq.model].filter(Boolean).join(' ') : '',
        '地點': eq ? (eq.location || '') : '',
        '重量(kg)': l.weight ?? '',
        '組數': l.sets ?? '',
        '次數': l.reps ?? '',
        '備註': l.note || ''
      };
    });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:11},{wch:14},{wch:20},{wch:14},{wch:9},{wch:6},{wch:6},{wch:24}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '訓練紀錄');
  XLSX.writeFile(wb, `fitness-log-${new Date().toISOString().slice(0,10)}.xlsx`);
});
document.getElementById('import-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const imported = JSON.parse(reader.result);
      if(imported.exercises && imported.equipment && imported.logs){
        db = imported;
        saveDB();
        refreshExerciseSelects();
        refreshEquipmentSelects();
        renderManage();
        renderHistory();
        alert('匯入成功');
      } else {
        alert('檔案格式不正確');
      }
    }catch(err){
      alert('匯入失敗：'+err.message);
    }
  };
  reader.readAsText(file);
});
